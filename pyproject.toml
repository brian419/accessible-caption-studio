[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "accessible-caption-studio"
version = "1.0.0"
description = "Local-first studio for automatic, accessible video captions"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
  "fastapi>=0.115,<1",
  "pydantic>=2.10,<3",
  "python-multipart>=0.0.18,<1",
  "typer>=0.15,<1",
  "uvicorn>=0.34,<1",
  "yt-dlp[default]>=2025.1.15",
]

[project.optional-dependencies]
ml = [
  "faster-whisper>=1.1,<2",
  "numpy>=1.26,<2",
  "opencv-python-headless==4.10.0.84; sys_platform == 'darwin' and platform_machine == 'x86_64'",
  "opencv-python-headless>=4.11,<5; sys_platform != 'darwin' or platform_machine != 'x86_64'",
  "soundfile>=0.13,<1",
  "speechbrain>=1.0,<2",
  "torch==2.2.2; sys_platform == 'darwin' and platform_machine == 'x86_64'",
  "torch>=2.8,<3; sys_platform != 'darwin' or platform_machine != 'x86_64'",
  "torchaudio==2.2.2; sys_platform == 'darwin' and platform_machine == 'x86_64'",
  "torchaudio>=2.8,<3; sys_platform != 'darwin' or platform_machine != 'x86_64'",
  "transformers>=4.48,<5",
  "sentencepiece>=0.2,<1",
]
dev = [
  "httpx>=0.28,<1",
  "pytest>=8.3,<9",
  "pytest-playwright>=0.6,<1",
  "ruff>=0.9,<1",
]

[project.scripts]
accessible-caption-studio = "accessible_caption_studio.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
accessible_caption_studio = ["web/*.html", "web/*.css", "web/*.js"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
markers = [
  "browser: headless browser and responsive UI regression tests",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
