name: Fix caption localization modal test

on:
  push:
    paths:
      - '.github/caption-localization-modal-test-trigger.txt'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: work-2026-08-09
          fetch-depth: 0
      - name: Fix browser selector
        run: python scripts/fix_caption_localization_modal_test.py
      - name: Remove one-time files
        run: |
          rm scripts/fix_caption_localization_modal_test.py
          rm .github/workflows/fix-caption-localization-modal-test.yml
          rm .github/caption-localization-modal-test-trigger.txt
      - name: Commit browser test fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/browser/test_browser_ui.py scripts/fix_caption_localization_modal_test.py .github/workflows/fix-caption-localization-modal-test.yml .github/caption-localization-modal-test-trigger.txt
          git commit -m "Scope caption localization modal browser selector"
          git push origin HEAD:work-2026-08-09
