name: Repair Batch 2 backend preservation

on:
  push:
    branches: [major-iterations-batch-2]
    paths:
      - .github/workflows/repair-batch2-webapp.yml
      - scripts/repair_batch2_webapp.py

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: major-iterations-batch-2
          fetch-depth: 0

      - name: Restore tested major-iterations backend
        run: git show 3b09cbfb63d3c78f4db90ec750a160eb0d53db91:src/accessible_caption_studio/webapp.py > src/accessible_caption_studio/webapp.py

      - name: Layer Batch 2 routes onto tested backend
        run: python scripts/repair_batch2_webapp.py

      - name: Commit repaired backend
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/accessible_caption_studio/webapp.py
          git commit -m "Preserve tested backend in Batch 2"
          git push origin HEAD:major-iterations-batch-2
