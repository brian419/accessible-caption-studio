name: Apply major iterations UI polish

on:
  push:
    branches: [major-iterations]
    paths:
      - scripts/apply_major_ui_polish.py
      - .github/workflows/apply-major-ui.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: major-iterations

      - name: Apply UI polish
        run: python scripts/apply_major_ui_polish.py

      - name: Commit generated changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/accessible_caption_studio/web/app.js src/accessible_caption_studio/web/styles.css
          if git diff --cached --quiet; then
            echo "No generated changes to commit."
            exit 0
          fi
          git commit -m "Polish major iterations workspace UI"
          git push origin HEAD:major-iterations
