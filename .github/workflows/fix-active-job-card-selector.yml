name: Fix active job card selector

on:
  push:
    branches:
      - small-fixes-2026-08-09
    paths:
      - .github/active-job-selector-trigger.txt

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: small-fixes-2026-08-09
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/fix_active_job_card_selector.py
      - run: |
          git config user.name "Jeongbin Son"
          git config user.email "93548397+brian419@users.noreply.github.com"
          git add src/accessible_caption_studio/web/styles.css
          if ! git diff --cached --quiet; then
            git commit -m "Correct active project job card spacing selector"
          fi
          git rm scripts/fix_active_job_card_selector.py .github/workflows/fix-active-job-card-selector.yml .github/active-job-selector-trigger.txt
          git commit -m "Remove active job selector patch machinery"
          git push origin HEAD:small-fixes-2026-08-09
