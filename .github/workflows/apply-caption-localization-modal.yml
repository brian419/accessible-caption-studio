name: Apply caption localization modal

on:
  push:
    paths:
      - '.github/caption-localization-modal-trigger.txt'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: work-2026-08-09
          fetch-depth: 0
      - name: Apply modal refactor
        run: python scripts/apply_caption_localization_modal.py
      - name: Remove one-time files
        run: |
          rm scripts/apply_caption_localization_modal.py
          rm .github/workflows/apply-caption-localization-modal.yml
          rm .github/caption-localization-modal-trigger.txt
      - name: Commit localization modal
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/accessible_caption_studio/web/final_batch.js tests/browser/test_browser_ui.py scripts/apply_caption_localization_modal.py .github/workflows/apply-caption-localization-modal.yml .github/caption-localization-modal-trigger.txt
          git commit -m "Move caption localization into More tools modal"
          git push origin HEAD:work-2026-08-09
