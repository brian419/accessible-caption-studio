name: Apply consistent favorite icons

on:
  push:
    branches:
      - major-iterations-batch-2
    paths:
      - .github/favorite-icons-trigger.txt

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: major-iterations-batch-2
          fetch-depth: 0

      - name: Apply favorite icon patch
        run: |
          python scripts/apply_consistent_favorite_icons.py

      - name: Commit product changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/accessible_caption_studio/web/styles.css tests/browser/test_browser_ui.py
          if git diff --cached --quiet; then
            echo "No product changes to commit."
            exit 0
          fi
          git commit -m "Standardize favorite icons"
          git push origin HEAD:major-iterations-batch-2
