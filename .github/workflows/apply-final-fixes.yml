name: Apply final batch fixes

on:
  push:
    branches:
      - major-iterations-batch-2
    paths:
      - .github/final-roadmap-fix-trigger.txt

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: major-iterations-batch-2
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Apply Ruff safe fixes
        run: |
          python -m pip install ruff
          ruff check . --fix --ignore E501
          python -m compileall -q src tests
          node --check src/accessible_caption_studio/web/app.js
          node --check src/accessible_caption_studio/web/final_batch.js
      - name: Commit fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No fixes required."
            exit 0
          fi
          git commit -m "Fix final roadmap lint issues"
          git push origin HEAD:major-iterations-batch-2
