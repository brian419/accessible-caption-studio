name: Fix active job height transition

on:
  push:
    branches:
      - small-fixes-2026-08-09
    paths:
      - .github/active-job-height-transition-trigger.txt

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: small-fixes-2026-08-09
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/fix_active_job_height_transition.py
      - run: |
          git config user.name "Jeongbin Son"
          git config user.email "93548397+brian419@users.noreply.github.com"
          git add src/accessible_caption_studio/web/final_batch.js
          git commit -m "Prevent active job card height animation"
          git rm scripts/fix_active_job_height_transition.py .github/workflows/fix-active-job-height-transition.yml .github/active-job-height-transition-trigger.txt
          git commit -m "Remove active job height transition patch machinery"
          git push origin HEAD:small-fixes-2026-08-09
