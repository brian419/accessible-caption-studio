name: Apply font favorite optical center

on:
  push:
    branches:
      - major-iterations-batch-2
    paths:
      - .github/font-favorite-optical-center-trigger.txt

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: major-iterations-batch-2
          fetch-depth: 0

      - name: Apply optical centering
        run: python scripts/apply_font_favorite_optical_center.py

      - name: Commit product changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/accessible_caption_studio/web/styles.css
          if git diff --cached --quiet; then
            echo "No product changes to commit."
            exit 0
          fi
          git commit -m "Optically center font favorite control"
          git push origin HEAD:major-iterations-batch-2
