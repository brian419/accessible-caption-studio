name: Apply translation review status UI

on:
  push:
    branches: [work-2026-08-09]
    paths:
      - .github/translation-review-status-ui-trigger.txt

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work-2026-08-09
          fetch-depth: 0
      - name: Apply UI patch
        run: python scripts/apply_translation_review_status_ui.py
      - name: Commit product and regression changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/accessible_caption_studio/web/final_batch.js tests/browser/test_browser_ui.py
          git commit -m "Clarify translation review status"
      - name: Remove one-time patch machinery
        run: |
          git rm scripts/apply_translation_review_status_ui.py .github/workflows/apply-translation-review-status-ui.yml .github/translation-review-status-ui-trigger.txt
          git commit -m "Remove one-time translation review status patch"
      - name: Push
        run: git push origin HEAD:work-2026-08-09
