name: Apply runtime active job spacing

on:
  push:
    branches:
      - small-fixes-2026-08-09
    paths:
      - .github/runtime-active-job-spacing-trigger.txt

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: small-fixes-2026-08-09
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/apply_runtime_active_job_spacing.py
      - run: |
          git config user.name "Jeongbin Son"
          git config user.email "93548397+brian419@users.noreply.github.com"
          git add src/accessible_caption_studio/web/final_batch.js src/accessible_caption_studio/web/styles.css
          if ! git diff --cached --quiet; then
            git commit -m "Reserve active job space in Cards layout"
          fi
          git rm scripts/apply_runtime_active_job_spacing.py .github/workflows/apply-runtime-active-job-spacing.yml .github/runtime-active-job-spacing-trigger.txt
          git commit -m "Remove runtime active job spacing patch machinery"
          git push origin HEAD:small-fixes-2026-08-09
