name: Fix localization browser test

on:
  push:
    branches:
      - work-2026-08-09
    paths:
      - .github/fix-localization-browser-test-trigger.txt

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Check out work branch
        uses: actions/checkout@v4
        with:
          ref: work-2026-08-09

      - name: Fix localization browser test
        run: python scripts/fix_localization_browser_test.py

      - name: Commit browser test fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Fix localization browser interaction test"
          git push origin HEAD:work-2026-08-09
