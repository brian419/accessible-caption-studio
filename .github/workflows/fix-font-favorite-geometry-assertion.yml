name: Fix font favorite geometry assertion

on:
  push:
    branches:
      - major-iterations-batch-2
    paths:
      - .github/font-favorite-geometry-assertion-trigger.txt

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: major-iterations-batch-2
          fetch-depth: 0

      - name: Apply test fix
        run: python scripts/fix_font_favorite_geometry_assertion.py

      - name: Commit test fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/browser/test_browser_ui.py
          if git diff --cached --quiet; then
            echo "No test changes to commit."
            exit 0
          fi
          git commit -m "Account for font row border in favorite geometry test"
          git push origin HEAD:major-iterations-batch-2
