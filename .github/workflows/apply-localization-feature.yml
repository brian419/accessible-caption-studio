name: Apply localization feature

on:
  push:
    branches:
      - work-2026-08-09
    paths:
      - .github/localization-trigger.txt

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Check out work branch
        uses: actions/checkout@v4
        with:
          ref: work-2026-08-09

      - name: Apply localization feature
        run: python scripts/apply_localization_feature.py

      - name: Commit product changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add multilingual caption localization workflow"
          git push origin HEAD:work-2026-08-09
