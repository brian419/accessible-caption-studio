name: Fix caption localization toolbar test

on:
  push:
    branches:
      - work-2026-08-09
    paths:
      - .github/caption-localization-toolbar-test-trigger.txt

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: work-2026-08-09
          fetch-depth: 0

      - name: Correct served script path in browser regression
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('tests/browser/test_browser_ui.py')
          text = path.read_text(encoding='utf-8')
          old = "fetch('/final_batch.js').then((response) => response.text())"
          new = "fetch('/final-batch.js').then((response) => response.text())"
          if old not in text:
              raise SystemExit('Expected localization toolbar test path was not found')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY

      - name: Remove one-time files
        run: |
          rm -f .github/workflows/fix-caption-localization-toolbar-test.yml
          rm -f .github/caption-localization-toolbar-test-trigger.txt

      - name: Commit browser regression correction
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Fix caption localization toolbar browser regression path"
          git push origin HEAD:work-2026-08-09
