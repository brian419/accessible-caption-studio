name: Apply active job card spacing fix

on:
  push:
    branches:
      - small-fixes-2026-08-09
    paths:
      - .github/active-job-card-spacing-trigger.txt

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: small-fixes-2026-08-09
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Apply spacing fix
        run: python scripts/apply_active_job_card_spacing_fix.py
      - name: Commit product and regression changes
        run: |
          git config user.name "Jeongbin Son"
          git config user.email "93548397+brian419@users.noreply.github.com"
          git add src/accessible_caption_studio/web/styles.css tests/browser/test_browser_ui.py
          if ! git diff --cached --quiet; then
            git commit -m "Reserve space for active project job status"
          fi
          git rm scripts/apply_active_job_card_spacing_fix.py .github/workflows/apply-active-job-card-spacing-fix.yml .github/active-job-card-spacing-trigger.txt
          git commit -m "Remove active job spacing patch machinery"
          git push origin HEAD:small-fixes-2026-08-09
