name: Apply small fixes batch

on:
  push:
    paths:
      - '.github/small-fixes-batch-trigger.txt'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: small-fixes-2026-08-09
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply product and regression changes
        run: python scripts/apply_small_fixes_batch.py
      - name: Commit fixes
        run: |
          git config user.name "Jeongbin Son"
          git config user.email "93548397+brian419@users.noreply.github.com"
          git add src/accessible_caption_studio/web/app.js src/accessible_caption_studio/web/styles.css tests/browser/test_browser_ui.py
          git commit -m "Improve backup feedback and project job spacing"
      - name: Remove one-time patch machinery
        run: |
          rm -f scripts/apply_small_fixes_batch.py .github/workflows/apply-small-fixes-batch.yml .github/small-fixes-batch-trigger.txt
          git add -A
          git commit -m "Remove one-time small fixes patch machinery"
      - name: Push branch
        run: git push origin HEAD:small-fixes-2026-08-09
