name: Refine structured editor UI

on:
  push:
    branches: [major-iterations]
    paths:
      - .github/workflows/apply-structured-editor-ui.yml

permissions:
  contents: write

jobs:
  refine:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: major-iterations

      - name: Refine generated UI
        run: |
          python - <<'PY'
          from pathlib import Path

          app = Path('src/accessible_caption_studio/web/app.js')
          text = app.read_text()
          old = 'commandBar.setAttribute("role", "toolbar");'
          if text.count(old) != 1:
              raise SystemExit(f'Expected one toolbar role, found {text.count(old)}')
          app.write_text(text.replace(old, 'commandBar.setAttribute("role", "group");'))

          css = Path('src/accessible_caption_studio/web/styles.css')
          text = css.read_text()
          marker = '/* structured editor refinement */'
          if marker not in text:
              text += '''\n\n/* structured editor refinement */\n.project-search-field input {\n  padding-left: .75rem;\n  background-image: none;\n}\n'''
              css.write_text(text)
          PY

      - name: Commit refinements
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/accessible_caption_studio/web/app.js src/accessible_caption_studio/web/styles.css
          if git diff --cached --quiet; then
            echo "No refinements to commit."
            exit 0
          fi
          git commit -m "Refine structured editor interactions"
          git push origin HEAD:major-iterations
