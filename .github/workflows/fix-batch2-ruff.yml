name: Fix Batch 2 Ruff

on:
  push:
    branches: [major-iterations-batch-2]
    paths:
      - .github/workflows/fix-batch2-ruff.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: major-iterations-batch-2

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Ruff
        run: python -m pip install "ruff>=0.9,<1"

      - name: Apply safe Ruff fixes
        run: ruff check . --fix --ignore E501

      - name: Commit fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -u
          if git diff --cached --quiet; then
            echo "No Ruff changes were needed."
            exit 0
          fi
          git commit -m "Apply Ruff fixes to Batch 2"
          git push origin HEAD:major-iterations-batch-2
