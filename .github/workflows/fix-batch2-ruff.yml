name: Fix Batch 2 Ruff

on:
  push:
    branches: [major-iterations-batch-2]
    paths:
      - .github/workflows/fix-batch2-ruff.yml

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: major-iterations-batch-2

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Ruff
        run: python -m pip install "ruff>=0.9,<1"

      - name: Capture Ruff report
        run: ruff check . --ignore E501 --output-format=concise > batch2-ruff-report.txt || true

      - name: Commit report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add batch2-ruff-report.txt
          git commit -m "Capture Batch 2 Ruff report"
          git push origin HEAD:major-iterations-batch-2
