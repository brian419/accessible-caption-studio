name: Fix active job spacing test

on:
  push:
    branches:
      - small-fixes-2026-08-09
    paths:
      - .github/active-job-spacing-test-trigger.txt

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: small-fixes-2026-08-09
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/fix_active_job_spacing_test.py
      - run: |
          git config user.name "Jeongbin Son"
          git config user.email "93548397+brian419@users.noreply.github.com"
          git add tests/browser/test_browser_ui.py
          if ! git diff --cached --quiet; then
            git commit -m "Test active job card spacing atomically"
          fi
          git rm scripts/fix_active_job_spacing_test.py .github/workflows/fix-active-job-spacing-test.yml .github/active-job-spacing-test-trigger.txt
          git commit -m "Remove active job spacing test patch machinery"
          git push origin HEAD:small-fixes-2026-08-09
