name: Apply caption localization toolbar

on:
  push:
    branches:
      - work-2026-08-09
    paths:
      - .github/caption-localization-toolbar-trigger.txt

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: work-2026-08-09
          fetch-depth: 0

      - name: Apply localization toolbar patch
        run: python scripts/apply_caption_localization_toolbar.py

      - name: Remove one-time patch files
        run: |
          rm -f scripts/apply_caption_localization_toolbar.py
          rm -f .github/workflows/apply-caption-localization-toolbar.yml
          rm -f .github/caption-localization-toolbar-trigger.txt

      - name: Commit refined localization toolbar
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Refine caption localization toolbar layout"
          git push origin HEAD:work-2026-08-09
