name: Apply equal active job card height

on:
  push:
    paths:
      - '.github/equal-active-job-card-height-trigger.txt'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: small-fixes-2026-08-09
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply patch
        run: python scripts/apply_equal_active_job_card_height.py
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/accessible_caption_studio/web/final_batch.js tests/browser/test_browser_ui.py
          git commit -m "Keep active job cards equal height"
          git push origin HEAD:small-fixes-2026-08-09
