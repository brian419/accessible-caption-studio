name: Apply final roadmap batch

on:
  push:
    branches:
      - major-iterations-batch-2
    paths:
      - scripts/apply_final_roadmap_batch.py
      - .github/final-roadmap-trigger.txt

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: major-iterations-batch-2
          fetch-depth: 0

      - name: Apply final roadmap batch
        run: |
          python scripts/apply_final_roadmap_batch.py
          # Workflow files cannot be pushed by this Actions token. The release
          # workflow is added directly after the product batch is validated.
          rm -f .github/workflows/release.yml
          # The model manager uses its own deduplicated size calculation.
          sed -i 's/from \.models import path_size, utc_now/from .models import utc_now/' src/accessible_caption_studio/model_management.py
          python -m compileall -q src tests
          node --check src/accessible_caption_studio/web/app.js
          node --check src/accessible_caption_studio/web/final_batch.js

      - name: Commit generated changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No generated changes to commit."
            exit 0
          fi
          git commit -m "Finish remaining roadmap tickets"
          git push origin HEAD:major-iterations-batch-2
