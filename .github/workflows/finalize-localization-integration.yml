name: Finalize localization integration

on:
  push:
    branches:
      - work-2026-08-09
    paths:
      - .github/localization-finalize-trigger.txt

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Check out work branch
        uses: actions/checkout@v4
        with:
          ref: work-2026-08-09

      - name: Apply integration safeguards
        run: python scripts/finalize_localization_integration.py

      - name: Commit integration changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Harden multilingual caption track integration"
          git push origin HEAD:work-2026-08-09
