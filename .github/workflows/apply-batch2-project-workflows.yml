name: Apply Batch 2 project workflows

on:
  push:
    branches: [major-iterations-batch-2]
    paths:
      - scripts/apply_batch2_project_workflows.py
      - .github/workflows/apply-batch2-project-workflows.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: major-iterations-batch-2

      - name: Apply Batch 2 integration
        run: python scripts/apply_batch2_project_workflows.py

      - name: Commit generated changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/accessible_caption_studio/webapp.py src/accessible_caption_studio/exports.py src/accessible_caption_studio/web/app.js src/accessible_caption_studio/web/styles.css tests/browser/test_browser_ui.py
          if git diff --cached --quiet; then
            echo "No generated changes to commit."
            exit 0
          fi
          git commit -m "Add project workflow Batch 2 features"
          git push origin HEAD:major-iterations-batch-2
