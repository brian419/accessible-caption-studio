name: Apply localization spacing refinement

on:
  push:
    branches: [work-2026-08-09]
    paths:
      - .github/localization-spacing-refinement-trigger.txt

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: work-2026-08-09
          fetch-depth: 0

      - name: Apply localization spacing refinement
        run: python scripts/apply_localization_spacing_refinement.py

      - name: Remove one-time patch files
        run: |
          rm scripts/apply_localization_spacing_refinement.py
          rm .github/workflows/apply-localization-spacing-refinement.yml
          rm .github/localization-spacing-refinement-trigger.txt

      - name: Commit refined localization spacing
        run: |
          git config user.name "Jeongbin Son"
          git config user.email "93548397+brian419@users.noreply.github.com"
          git add src/accessible_caption_studio/web/final_batch.js tests/browser/test_browser_ui.py scripts/apply_localization_spacing_refinement.py .github/workflows/apply-localization-spacing-refinement.yml .github/localization-spacing-refinement-trigger.txt
          git commit -m "Give caption localization controls more space"
          git push origin HEAD:work-2026-08-09
